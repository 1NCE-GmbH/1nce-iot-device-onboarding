AWSTemplateFormatVersion: "2010-09-09"
Description: Create lambda to handle the SIM retrieval process

Parameters:
  #=======================================================
  #
  #                   CloudFormation Parameters
  #
  #=======================================================
  FunctionName:
    Description: Name of the function which should be invoked
    Type: String

Resources:
  #=======================================================
  #
  #                   Lambda resources
  #
  #=======================================================
  LambdaInvokeIAMRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaRole

  LambdaInvoke:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs24.x
      Timeout: 30
      Role:
        Fn::GetAtt:
          - LambdaInvokeIAMRole
          - Arn
      Handler: index.handler
      Code:
        ZipFile: |
          const { LambdaClient, InvokeCommand } = require('@aws-sdk/client-lambda');
          const response = require('cfn-response');
          exports.handler = async function (event, context) {
              console.log("REQUEST RECEIVED:\n" + JSON.stringify(event));
              // For Delete requests, immediately send a SUCCESS response.
              if (event.RequestType == "Delete") {
                  await sendResponse(event, context, response.SUCCESS, {});
                  return;
              }
              const functionName = event.ResourceProperties.FunctionName;
              const lambda = new LambdaClient();
              try {
                  await lambda.send(new InvokeCommand({ FunctionName: functionName, InvocationType: "Event" }));
                  await sendResponse(event, context, response.SUCCESS, {});
              } catch (err) {
                  console.log("Invoke call failed:\n", err);
                  await sendResponse(event, context, response.FAILED, { Error: "Invoke call failed" });
              }
          }
          // Wrap cfn-response's callback-based send so it can be awaited in the async handler.
          function sendResponse(event, context, status, data) {
              return new Promise(function (resolve) {
                  const done = context.done;
                  context.done = function () {
                      resolve();
                      if (done) {
                          done.apply(context, arguments);
                      }
                  };
                  response.send(event, context, status, data);
              });
          }
      Description: Invoke a function during stack creation and return cfn-response

  LambdaFirstInvoke:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - LambdaInvoke
          - Arn
      FunctionName:
        Ref: FunctionName
